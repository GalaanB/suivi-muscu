<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Suivi Muscu</title>
<meta name="theme-color" content="#0d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#0d0e11; --card:#17191e; --card2:#20232a; --line:#2b2f38;
  --txt:#f2f3f5; --mut:#9aa0aa; --ant:#ff9142; --post:#4aa8ff;
  --ok:#35c46a; --pr:#ffd24a; --bad:#ff5d5d; --acc:var(--ant);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
body{min-height:100vh;touch-action:manipulation;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

header{position:sticky;top:0;z-index:5;background:rgba(13,14,17,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line)}
header h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:13px;color:var(--mut)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card)}
.iconbtn svg{width:22px;height:22px}

main{padding:14px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(19,21,25,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600;border-radius:10px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--txt)}
nav button.on svg{color:var(--acc)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0}
.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mut);margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.pr{background:rgba(255,210,74,.16);color:var(--pr)}
.ant{--acc:var(--ant)} .post{--acc:var(--post)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block;flex:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;
  background:var(--acc);color:#111;font-weight:700;font-size:17px;padding:0 16px}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.danger{background:rgba(255,93,93,.14);color:var(--bad)}
.btn.sm{min-height:44px;font-size:15px}
.btn:active,.chip:active,.iconbtn:active,.li:active{opacity:.7}
.link{color:var(--mut);font-size:14px;padding:12px;display:block;margin:4px auto;text-decoration:underline}

.hero h2{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--acc);margin:2px 0 10px}
.hero ol{margin:0 0 14px;padding-left:22px;color:var(--mut);font-size:14px}
.hero ol li{padding:2px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--acc);color:#111;border-color:transparent}

/* Séance */
.ex h3{font-size:17px;font-weight:700}
.ex .last{font-size:13px;color:var(--mut);margin:4px 0 10px}
.ex.alldone{border-color:rgba(53,196,106,.45)}
.set{display:flex;align-items:center;gap:8px;margin-top:8px}
.set .lab{width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mut);flex:none}
.set.warm .lab{background:transparent;border:1px dashed var(--line)}
.set .fld{flex:1;display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:52px;min-width:0}
.set .fld input{flex:1;width:100%;min-width:0;background:none;border:0;outline:0;font-size:20px;font-weight:700;text-align:center;padding:0}
.set .fld input::placeholder{color:#5d636e;font-weight:600}
.set .fld span{font-size:12px;color:var(--mut);font-weight:600}
.set .fld:focus-within{border-color:var(--acc)}
.set .x{color:var(--mut);font-weight:700}
.set .chk{width:52px;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mut)}
.set .chk svg{width:24px;height:24px}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#08240f}
.set.done .fld{border-color:transparent;opacity:.85}
.set.isPr .lab{background:rgba(255,210,74,.18);color:var(--pr)}
.progress{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:2px 0 14px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:3px}

/* Listes */
.li{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.li .t{font-weight:600}
.li .chev{color:var(--mut);flex:none}
.li.paused .t{color:var(--mut);text-decoration:line-through}
.mv{display:flex;flex-direction:column;gap:4px;flex:none}
.mv button{width:40px;height:30px;border-radius:8px;background:var(--card2);display:grid;place-items:center;color:var(--mut)}
.mv button:disabled{opacity:.25}
.mv svg{width:16px;height:16px}

/* Stats */
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.hist{font-size:14px;padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.hist .d{color:var(--mut);width:64px;flex:none}

/* Calendrier */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{font-size:18px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid .wd{font-size:11px;color:var(--mut);text-align:center;font-weight:700;padding:4px 0}
.day{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--mut);background:transparent}
.day.today{box-shadow:inset 0 0 0 2px var(--line);color:var(--txt)}
.day.a{background:var(--ant);color:#111;font-weight:800}
.day.p{background:var(--post);color:#111;font-weight:800}
.day.ap{background:linear-gradient(135deg,var(--ant) 50%,var(--post) 50%);color:#111;font-weight:800}
.legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:13px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}

/* Feuille (fenêtre du bas) */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#15171b;border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);max-width:560px;margin:0 auto}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sheet h2{font-size:19px;margin-bottom:4px}
#sheet .btn{margin-top:10px}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.field input[type=text]{width:100%;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:0 14px;outline:0;font-size:17px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:12px;background:var(--card2);font-size:26px;font-weight:600}
.stepper b{font-size:22px;min-width:28px;text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 14px;border-radius:14px;background:var(--card2);margin-top:10px;font-weight:600;text-align:left}
.toggle i{width:50px;height:30px;border-radius:15px;background:#3a3f4a;position:relative;flex:none;transition:.15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on i{background:var(--ok)} .toggle.on i::after{left:23px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%) translateY(-20px);z-index:30;
  background:#f2f3f5;color:#111;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mut);padding:36px 20px;font-size:15px}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Suivi Muscu</h1><div class="sub" id="subtitle"></div></div>
  <button class="iconbtn" data-action="openSettings" aria-label="Sauvegarde et réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
  </button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-action="tab" data-tab="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Séance</button>
  <button data-action="tab" data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progrès</button>
  <button data-action="tab" data-tab="calendrier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier</button>
  <button data-action="tab" data-tab="programme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Programme</button>
</nav>
<div id="sheet"><div class="bg" data-action="closeSheet"></div><div class="panel"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,.txt,application/json,text/plain" hidden>
<script src="app.js"></script>
</body>
</html>
